name: Release

# 触发方式：
#   1. 推送版本 tag（如 v0.1.0）自动构建并发布 Release
#   2. 在 GitHub Actions 页面手动运行（workflow_dispatch）
#
# 产物命名规范：OneTOTP_{版本}_{系统}_{架构}-{类型}.{后缀}
#   例：OneTOTP_0.1.0_windows_x64-setup.exe
#       OneTOTP_0.1.0_windows_x64-portable.exe
#       OneTOTP_0.1.0_windows_arm64-setup.exe
#       OneTOTP_0.1.0_macos_x64.dmg / _arm64.dmg / _universal.dmg
#       OneTOTP_0.1.0_linux_x86_64.deb / .rpm / .AppImage
#       OneTOTP_0.1.0_linux_arm64.deb / .rpm / .AppImage
#       OneTOTP_0.1.0_android_arm64.apk / _armv7.apk / _x86.apk / _x86_64.apk
#       OneTOTP_0.1.0_ios-unsigned.ipa
#
# 说明：
#   - Tauri 2 不支持 32 位 Windows（i686），故 Windows 仅出 x64 / arm64。
#   - iOS 产物是**未签名**包，安装前需使用者用 Apple ID 自行重签
#     （Sideloadly / AltStore / Xcode），详见 README「iOS 安装说明」。
#     之所以不做签名：签名身份属于使用者自己，仓库不应也无需持有证书。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  NODE_VERSION: '22'

jobs:
  # ═══════════════════════ Windows (x64 / arm64) ═══════════════════════
  build-windows:
    name: Windows ${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { triple: x86_64-pc-windows-msvc, arch: x64 }
          - { triple: aarch64-pc-windows-msvc, arch: arm64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: develop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: develop/src-tauri
          key: ${{ matrix.triple }}

      - name: Install dependencies
        working-directory: develop
        run: npm ci

      - name: Build (NSIS)
        working-directory: develop
        run: npm run tauri build -- --target ${{ matrix.triple }} --bundles nsis

      - name: Collect artifacts
        shell: pwsh
        run: |
          $ver = node -p "require('./develop/package.json').version"
          $dir = "develop/src-tauri/target/${{ matrix.triple }}/release"
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Copy-Item "$dir/bundle/nsis/*-setup.exe" "artifacts/OneTOTP_${ver}_windows_${{ matrix.arch }}-setup.exe"
          Copy-Item "$dir/onetotp.exe"           "artifacts/OneTOTP_${ver}_windows_${{ matrix.arch }}-portable.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: artifacts/

  # ═══════════════════════ Linux (x86_64 / arm64) ═══════════════════════
  build-linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-22.04,     triple: x86_64-unknown-linux-gnu,  arch: x86_64 }
          - { runner: ubuntu-22.04-arm, triple: aarch64-unknown-linux-gnu, arch: arm64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: develop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: develop/src-tauri
          key: ${{ matrix.triple }}

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            file \
            rpm

      - name: Install dependencies
        working-directory: develop
        run: npm ci

      - name: Build (deb, rpm, AppImage)
        working-directory: develop
        run: npm run tauri build -- --target ${{ matrix.triple }} --bundles deb,rpm,appimage

      - name: Collect artifacts
        shell: bash
        run: |
          ver=$(node -p "require('./develop/package.json').version")
          dir="develop/src-tauri/target/${{ matrix.triple }}/release/bundle"
          mkdir -p artifacts
          cp "$dir"/deb/*.deb           "artifacts/OneTOTP_${ver}_linux_${{ matrix.arch }}.deb"
          cp "$dir"/rpm/*.rpm           "artifacts/OneTOTP_${ver}_linux_${{ matrix.arch }}.rpm"
          cp "$dir"/appimage/*.AppImage "artifacts/OneTOTP_${ver}_linux_${{ matrix.arch }}.AppImage"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: artifacts/

  # ═══════════════════════ macOS (x64 / arm64 / universal) ═══════════════════════
  build-macos:
    name: macOS ${{ matrix.arch }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { triple: x86_64-apple-darwin,    arch: x64 }
          - { triple: aarch64-apple-darwin,   arch: arm64 }
          - { triple: universal-apple-darwin, arch: universal }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: develop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: develop/src-tauri
          key: ${{ matrix.triple }}

      - name: Install dependencies
        working-directory: develop
        run: npm ci

      - name: Build (dmg)
        working-directory: develop
        run: npm run tauri build -- --target ${{ matrix.triple }} --bundles dmg

      - name: Collect artifacts
        shell: bash
        run: |
          ver=$(node -p "require('./develop/package.json').version")
          mkdir -p artifacts
          cp develop/src-tauri/target/${{ matrix.triple }}/release/bundle/dmg/*.dmg \
             "artifacts/OneTOTP_${ver}_macos_${{ matrix.arch }}.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: artifacts/

  # ═══════════════════════ Android (arm64 / armv7 / x86 / x86_64) ═══════════════════════
  build-android:
    name: Android ${{ matrix.name }}
    # 固定 24.04：本 job 依赖 runner 预装的 Android SDK/NDK 环境，
    # 而 ubuntu-latest 将于 2026-10-19 迁移到 Ubuntu 26，避免环境突变导致构建失败。
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64, name: arm64 }
          - { target: armv7,   name: armv7 }
          - { target: x86_64,  name: x86_64 }
          - { target: i686,    name: x86 }
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: develop/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest 已预装 Android SDK（ANDROID_HOME=/usr/local/lib/android/sdk），
      # 无需 android-actions/setup-android（其安装的旧 tools 包已废弃会报错）

      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b
          add-to-path: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: develop/src-tauri
          key: android-${{ matrix.target }}

      - name: Install dependencies
        working-directory: develop
        run: npm ci

      # 配置了签名 secrets 时恢复正式 keystore；否则出未签名包
      - name: Restore release keystore
        if: env.KEYSTORE_BASE64 != ''
        shell: bash
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > develop/src-tauri/gen/android/onetotp-release.keystore

      # 仓库内的 gradle-wrapper 使用腾讯云镜像（本地开发加速），
      # 但 CI runner 在海外访问腾讯云会超时，这里临时改为官方源（仅本次构建有效，不改仓库文件）。
      - name: Use official Gradle distribution in CI
        shell: bash
        run: |
          F=develop/src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties
          sed -i 's#mirrors.cloud.tencent.com/gradle#services.gradle.org/distributions#g' "$F"
          grep distributionUrl "$F"

      - name: Build APK
        working-directory: develop
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: npm run tauri android build -- --apk --target ${{ matrix.target }}

      - name: Sign APK
        if: env.KEYSTORE_BASE64 != ''
        shell: bash
        run: |
          ver=$(node -p "require('./develop/package.json').version")
          UNSIGNED=$(find develop/src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -n 1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -n 1)
          rm -rf artifacts && mkdir -p artifacts
          "$APKSIGNER" sign \
            --ks develop/src-tauri/gen/android/onetotp-release.keystore \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEYSTORE_PASSWORD" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --v4-signing-enabled false \
            --out "artifacts/OneTOTP_${ver}_android_${{ matrix.name }}.apk" \
            "$UNSIGNED"
          "$APKSIGNER" verify --verbose "artifacts/OneTOTP_${ver}_android_${{ matrix.name }}.apk"

      - name: Collect unsigned APK
        if: env.KEYSTORE_BASE64 == ''
        shell: bash
        run: |
          ver=$(node -p "require('./develop/package.json').version")
          APK=$(find develop/src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -n 1)
          rm -rf artifacts && mkdir -p artifacts
          cp "$APK" "artifacts/OneTOTP_${ver}_android_${{ matrix.name }}-unsigned.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.name }}
          path: artifacts/

  # ═══════════════════════ iOS（无签名编译） ═══════════════════════
  # 产物是**未签名**的 .ipa：任何人都能下载，但安装到真机前必须自己用
  # Apple ID 重签（Sideloadly / AltStore / Xcode 均可，详见 README）。
  #
  # 为什么不做签名：签名需要 Apple 开发者账号（$99/年）与证书、描述文件、
  # Team ID 等一整套 secrets。仓库维护者不持有证书，也不应替使用者承担
  # 签名责任——签名身份属于使用者自己。无签名编译不需要任何 Apple 凭据，
  # GitHub 的 macOS runner 可直接完成，因此本 job 无条件执行，
  # 不再依赖「是否配置了证书」的探测。
  #
  # 关于 --no-sign 的实际行为（与直觉不同，值得写下来）：
  # 它不止是「跳过签名」，而是让 tauri **跳过 xcodebuild build 这一步**，
  # 直接对工程做一次跳过签名的 archive。archive 产物是
  # `<scheme>.xcarchive/Products/Applications/<name>.app`，
  # **不会**自动生成 .ipa —— 所以下面手工打 Payload/ 目录。
  build-ios:
    name: iOS
    runs-on: macos-latest
    # Rust 全量编译 + Xcode archive 在 macOS runner 上约 15~25 分钟，
    # 给足余量避免被默认超时打断
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: develop/package-lock.json

      # 只装真机目标（aarch64-apple-ios）。不装模拟器目标 --
      # 那是另一个 triple，多装一份只会拖慢缓存恢复。
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: develop/src-tauri
          key: ios-unsigned

      - name: Install dependencies
        working-directory: develop
        run: npm ci

      # --ci 跳过所有交互式提问。GitHub Actions 本身会设置 CI=true，
      # tauri 的 ci 参数也读该环境变量，这里显式传入双保险。
      - name: Init iOS project
        working-directory: develop
        run: npm run tauri ios init -- --ci

      # tauri 在 build 前会调用 ensure_ios_runtime_installed()，
      # 它会 `xcrun simctl list runtimes` 检查 iOS 运行时；缺失时抛出
      # 一个**交互式提问**（CI 下读不到输入 → 取默认 false → 直接报错退出）。
      # 虽然 macos-latest 一般自带运行时，但一旦缺就是 20 分钟后才失败，
      # 这里提前探测并静默补装，把不确定性挡在前面。
      #
      # 注意：不要写成 `xcrun ... | grep -q`。开了 pipefail 后 grep -q 提前退出
      # 会让 xcrun 收到 SIGPIPE，管道整体返回 141，条件判断就永远为假。
      - name: Ensure iOS runtime available
        shell: bash
        run: |
          set -euo pipefail
          runtimes=$(xcrun simctl list runtimes)
          if printf '%s\n' "$runtimes" | grep -q '^iOS '; then
            echo "iOS 运行时已就绪"
          else
            echo "未检测到 iOS 运行时，开始下载（耗时较长）"
            sudo xcodebuild -downloadPlatform iOS
            xcrun simctl list runtimes
          fi

      # 确认 Info.plist 里的权限描述真的合入成功了。
      #
      # 为什么要在 CI 里查：iOS 访问相机 / Face ID 前会校验对应的
      # UsageDescription，缺失时是**直接崩溃**而不是拒绝授权。
      # 这种错误在编译期完全看不出来，只能靠检查产物发现；
      # 一旦漏掉，用户装上去点「扫码」就闪退，反馈成本极高。
      #
      # 为什么遍历而不是写死路径：工程由 `ios init` 生成，scheme 目录名
      # 与层级属于 Tauri 内部约定，随版本可能变化。这里只要求「存在某个
      # Info.plist 同时含两个键」即可，对目录结构变化免疫。
      - name: Verify Info.plist usage descriptions
        shell: bash
        run: |
          set -euo pipefail
          plists=$(find develop/src-tauri/gen/apple -name Info.plist || true)

          found=0
          while IFS= read -r plist; do
            # 不能写 `[ -z "$plist" ] && continue`：条件为假时该语句返回 1，
            # 在 set -e 下会直接终止脚本。
            if [ -z "$plist" ]; then
              continue
            fi
            if /usr/libexec/PlistBuddy -c "Print :NSCameraUsageDescription" "$plist" >/dev/null 2>&1 \
               && /usr/libexec/PlistBuddy -c "Print :NSFaceIDUsageDescription" "$plist" >/dev/null 2>&1; then
              echo "OK  $plist 已包含相机与 Face ID 说明"
              found=1
              break
            fi
          done <<< "$plists"

          if [ "$found" -ne 1 ]; then
            echo "未找到同时含 NSCameraUsageDescription 与 NSFaceIDUsageDescription 的 Info.plist"
            echo "请检查 src-tauri/Info.plist 是否存在、plist 格式是否合法"
            printf '%s\n' "$plists"
            exit 1
          fi

      - name: Build iOS (unsigned)
        working-directory: develop
        run: npm run tauri ios build -- --no-sign --ci

      # 打包成 ipa。
      #
      # 兼容两种产物形态：
      #  1) tauri/xcode 直接吐出 .ipa（未来版本行为可能变化）
      #  2) 只有 xcarchive 里的 .app（当前 --no-sign 的实际行为）
      # ipa 的本质就是一个内含 Payload/<name>.app 的 zip，
      # 所以手工打包与 Xcode 导出在格式上等价。
      - name: Package unsigned ipa
        shell: bash
        run: |
          set -euo pipefail
          ver=$(node -p "require('./develop/package.json').version")
          GEN=develop/src-tauri/gen/apple

          # 注意：所有 `find | head` 都先落到变量再取首行。
          # 开了 pipefail 之后，head 提前退出会给 find 发 SIGPIPE，
          # 管道返回 141，`$(...)` 直接判定失败，脚本在 set -e 下退出。
          IPA=$(find "$GEN" -name '*.ipa' || true)
          IPA=$(printf '%s\n' "$IPA" | head -n 1)

          APP=$(find "$GEN" -path '*.xcarchive/Products/Applications/*.app' -type d || true)
          APP=$(printf '%s\n' "$APP" | head -n 1)
          if [ -z "$APP" ]; then
            # 兜底：有些布局把 .app 直接放在导出目录（不在 xcarchive 里）
            APP=$(find "$GEN" -name '*.app' -type d -not -path '*.xcarchive/*' || true)
            APP=$(printf '%s\n' "$APP" | head -n 1)
          fi

          rm -rf Payload artifacts && mkdir -p artifacts

          if [ -n "$IPA" ]; then
            echo "使用 tauri 已生成的 ipa：$IPA"
            cp "$IPA" "artifacts/OneTOTP_${ver}_ios-unsigned.ipa"
          elif [ -n "$APP" ]; then
            echo "从 .app 手工打包：$APP"
            mkdir -p Payload
            cp -R "$APP" Payload/
            # 交给 Xcode 重签时，Payload 里若残留旧的 _CodeSignature 会报冲突
            rm -rf Payload/*.app/_CodeSignature
            zip -qry "artifacts/OneTOTP_${ver}_ios-unsigned.ipa" Payload
          else
            echo "未找到任何 iOS 产物，构建目录结构如下："
            find "$GEN" -maxdepth 3 -type d
            exit 1
          fi

          test -s "artifacts/OneTOTP_${ver}_ios-unsigned.ipa"
          echo "--- 产物 ---"
          ls -lh artifacts
          echo "--- ipa 内容校验 ---"
          unzip -l "artifacts/OneTOTP_${ver}_ios-unsigned.ipa" > /tmp/ipa-list.txt
          head -n 10 /tmp/ipa-list.txt
          # Payload/ 下必须有且只有一个 .app，否则这个 ipa 装不上
          grep -q 'Payload/[^/]*\.app/' /tmp/ipa-list.txt || {
            echo "ipa 结构异常：缺少 Payload/<name>.app"
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: artifacts/
          if-no-files-found: error

  # ═══════════════════════ 发布 Release ═══════════════════════
  publish:
    # 只要还有成功产物就发布（某个架构失败不阻断其余产物）；仅 tag 触发时发布
    if: ${{ always() && startsWith(github.ref, 'refs/tags/') }}
    needs: [build-windows, build-linux, build-macos, build-android, build-ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: release
          merge-multiple: true

      - name: List collected artifacts
        run: ls -R release || echo "no artifacts"

      # 从 更新日志.md 中截取当前 tag 对应版本的段落作为 Release 正文。
      # 找不到对应版本时回退为空，由 generate_release_notes 兜底。
      - name: Extract changelog for this tag
        id: changelog
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"
          FILE="更新日志.md"
          if [ ! -f "$FILE" ]; then
            echo "changelog file not found"
            exit 0
          fi
          # 从「## ... vX.Y.Z」标题开始，截到下一个「## 」标题之前
          BODY=$(awk -v ver="$VER" '
            $0 ~ "^## .*v" ver "([^0-9.]|$)" { found=1; next }
            found && /^## / { exit }
            found { print }
          ' "$FILE")
          if [ -z "$(echo "$BODY" | tr -d '[:space:]')" ]; then
            echo "no changelog section for $VER"
            exit 0
          fi
          {
            echo "body<<__CHANGELOG_EOF__"
            echo "$BODY"
            echo "__CHANGELOG_EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/**/*
          body: ${{ steps.changelog.outputs.body }}
          generate_release_notes: ${{ steps.changelog.outputs.body == '' }}
