<svg xmlns="http://www.w3.org/2000/svg" width="108" height="108" viewBox="0 0 108 108">
  <defs>
    <linearGradient id="onetotp-and-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset="0.45" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
  </defs>
  <!-- Android 传统图标（ic_launcher.png / ic_launcher_round.png）：
       白色圆角底 + 居中盾牌。盾牌含描边高约 74dp（画布 108dp），
       四周留足边距，避免被各家启动器的圆形 / 方形遮罩裁到。 -->
  <rect x="0" y="0" width="108" height="108" rx="24" fill="#FFFFFF"/>
  <g transform="translate(12 11.3) scale(3.5)">
    <path d="M12 2.2 3.8 5.9v6.2c0 4.9 3.5 8.6 8.2 10 4.7-1.4 8.2-5.1 8.2-10V5.9L12 2.2z"
          fill="url(#onetotp-and-grad)"/>
    <circle cx="12" cy="10.4" r="2.1" fill="#FFFFFF"/>
    <path d="M12 12.2v4.2" fill="none" stroke="#FFFFFF" stroke-width="2.1" stroke-linecap="round"/>
    <path d="M12 2.2 3.8 5.9v6.2c0 4.9 3.5 8.6 8.2 10 4.7-1.4 8.2-5.1 8.2-10V5.9L12 2.2z"
          fill="none" stroke="url(#onetotp-and-grad)" stroke-width="1.2" stroke-linejoin="round"/>
  </g>
</svg>
