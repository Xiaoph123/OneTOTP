[package]
name = "onetotp"
version = "0.2.0"
description = "OneTotp - 纯离线身份验证器"
authors = ["wanghao"]
edition = "2021"

[lib]
name = "onetotp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 加密与密钥派生
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
base64 = "0.22"

# TOTP 计算
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"

# 编码
base32 = "0.5"
percent-encoding = "2"

# 标识与时间
uuid = { version = "1", features = ["v4"] }
time = { version = "0.3", features = ["formatting"] }
url = "2"

# 桌面专属插件：移动端（Android / iOS）无对应能力，按目标平台条件编译
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-global-shortcut = "2.4.1"

# 生物识别解锁：Windows Hello / macOS Touch ID / Android / iOS。
# Linux 无统一生物识别接口（仅 fprintd，需用户自行安装并录入），故不引入，UI 会显示不支持。
# Android 端已 vendor 到 plugins/ 并改用 Keystore AES-256-GCM（原版用 RSA-4096，
# 密钥生成需 1~3 秒导致「启用」明显卡顿；AES 密钥由系统瞬时生成，参见 Aegis 的实现）。
[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-biometry = { path = "plugins/tauri-plugin-biometry" }

# 原生扫码（Android / iOS）：用系统原生相机解码，绕开 WebView 的 getUserMedia
# 视频管线（该管线在部分 Android 设备上出帧帧率极低，导致预览卡顿不可用）。
# Android 侧使用 vendored 插件（CameraX + ZXing，零 GMS 依赖，完全离线）；
# iOS 侧沿用系统 Vision 框架。桌面端不使用该插件，扫码仍走 getUserMedia + jsQR。
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = { path = "plugins/tauri-plugin-qr-scanner" }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
