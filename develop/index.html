<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#ffffff" />
    <title>OneTotp</title>
    <script>
      // 首屏防白闪：在样式/React 就绪前先决定主题，避免亮暗切换跳变。
      // 优先级：应用内已保存的主题设置 > 系统偏好。
      // 主题设置由 src/lib/theme.ts 的 applyTheme() 镜像到 localStorage。
      try {
        var mode = null;
        try {
          mode = localStorage.getItem("onetotp.theme");
        } catch (e) {}
        if (mode !== "light" && mode !== "dark" && mode !== "system") mode = "light";
        var dark =
          mode === "dark" ||
          (mode === "system" &&
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
        var ua = navigator.userAgent.toLowerCase();
        var mobile = /android|iphone|ipad|ipod/.test(ua) ||
          (/macintosh/.test(ua) && navigator.maxTouchPoints > 1);
        document.documentElement.setAttribute("data-platform", mobile ? "mobile" : "desktop");
      } catch (e) {}
    </script>
    <style>
      /* 静态启动画面：随 HTML 立即渲染，React 挂载后由 main.tsx 移除 */
      /* 背景色对齐应用 --color-bg-2（亮 #FCFDFE / 暗 #141619），确保淡出无跳变 */
      html { background: #fcfdfe; }
      html[data-theme="dark"] { background: #141619; }
      body { margin: 0; }
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #fcfdfe;
        transition: opacity 200ms ease;
      }
      html[data-theme="dark"] #app-splash { background: #141619; }
      #app-splash.is-hidden { opacity: 0; pointer-events: none; }
      #app-splash svg { width: 72px; height: 72px; display: block; }
      #app-splash .splash-text {
        font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
        font-size: 13px;
        color: #a9aeb6;
      }
      #app-splash .onetotp-shine {
        animation: onetotp-shine-sweep 1.8s ease-in-out infinite;
        will-change: transform;
      }
      @keyframes onetotp-shine-sweep {
        0% { transform: translateX(-10px); }
        100% { transform: translateX(30px); }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-splash .onetotp-shine { animation: none; opacity: 0; }
      }
    </style>
  </head>

  <body>
    <div id="app-splash" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none">
        <defs>
          <linearGradient id="splash-grad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#34D399" />
            <stop offset="0.45" stop-color="#22D3EE" />
            <stop offset="1" stop-color="#6366F1" />
          </linearGradient>
          <linearGradient id="splash-shine" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#FFFFFF" stop-opacity="0" />
            <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.75" />
            <stop offset="1" stop-color="#FFFFFF" stop-opacity="0" />
          </linearGradient>
          <clipPath id="splash-clip">
            <path d="M12 2.2 3.8 5.9v6.2c0 4.9 3.5 8.6 8.2 10 4.7-1.4 8.2-5.1 8.2-10V5.9L12 2.2z" />
          </clipPath>
        </defs>
        <path
          d="M12 2.2 3.8 5.9v6.2c0 4.9 3.5 8.6 8.2 10 4.7-1.4 8.2-5.1 8.2-10V5.9L12 2.2z"
          fill="url(#splash-grad)"
        />
        <path d="M10.1 9.3 12.4 7.6V15.6" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M10.3 15.6h4" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
        <path d="M10.1 9.3h1.3" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
        <g clip-path="url(#splash-clip)">
          <g transform="skewX(-20)">
            <rect class="onetotp-shine" x="0" y="-2" width="6" height="28" fill="url(#splash-shine)" />
          </g>
        </g>
        <path
          d="M12 2.2 3.8 5.9v6.2c0 4.9 3.5 8.6 8.2 10 4.7-1.4 8.2-5.1 8.2-10V5.9L12 2.2z"
          stroke="url(#splash-grad)"
          stroke-width="1.2"
          stroke-linejoin="round"
        />
      </svg>
      <div class="splash-text">正在启动 OneTotp…</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
