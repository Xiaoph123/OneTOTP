<style id="critical-layout">
  .mw { display: flex; flex-direction: column; min-height: 100vh; width: 100%; background: linear-gradient(180deg, var(--color-primary-bg) 0%, var(--color-bg-2) 40%); }
  .mw-body { flex: 1; display: flex; align-items: center; justify-content: center; padding: 28px 18px; }
  .lock-card { width: 100%; max-width: 360px; background: var(--color-bg-card); border: 1px solid var(--color-border-light); border-radius: var(--radius-lg); box-shadow: var(--shadow-3); padding: 26px 20px; text-align: center; }
  .lock-avatar { width: 60px; height: 60px; border-radius: var(--radius-full); background: var(--color-primary-bg); color: var(--color-primary); font-size: var(--font-size-h2); font-weight: var(--font-weight-medium); display: inline-flex; align-items: center; justify-content: center; margin: 0 auto 14px; }
  .icon-btn { width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; border-radius: var(--radius-sm); background: transparent; color: var(--color-text-2); border: none; cursor: pointer; transition: background 150ms ease; flex-shrink: 0; }
  .icon-btn:hover { background: var(--color-bg-5); }
  .icon-btn svg { width: 18px; height: 18px; }
  .pin-dots { display: flex; justify-content: center; gap: 10px; margin: 16px 0; }
  .pin-dot { width: 11px; height: 11px; border-radius: 50%; border: 1.5px solid var(--color-border-4); }
  .pin-dot.filled { background: var(--color-primary); border-color: var(--color-primary); }
  .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 244px; margin: 0 auto; }
  .key-btn { height: 50px; border: none; border-radius: var(--radius-md); background: var(--color-bg-4); color: var(--color-text-1); font-size: var(--font-size-h2); font-weight: var(--font-weight-medium); cursor: pointer; transition: background 150ms ease, transform 100ms ease; box-shadow: inset 0 0 0 1px var(--color-border-light); display: flex; align-items: center; justify-content: center; }
  .key-btn:hover { background: var(--color-bg-5); }
  .key-btn:active { transform: scale(0.96); }
  .key-btn.ghost { background: transparent; box-shadow: none; color: var(--color-text-3); }
  .link-soft { font-size: var(--font-size-lead); color: var(--color-text-3); cursor: pointer; }
  .link-soft:hover { color: var(--color-primary); }
</style>

<div class="mw">
  <div class="mw-body">
    <div class="lock-card">
      <div class="lock-avatar">王</div>
      <div style="font-size:var(--font-size-h3);font-weight:var(--font-weight-medium);color:var(--color-text-1);">应用已锁定</div>
      <div style="font-size:var(--font-size-lead);color:var(--color-text-3);margin-top:4px;">请输入密码以解锁 oneTotp</div>

      <form style="margin-top:16px;" data-dom-id="unlock-form" onsubmit="return false;">
        <div style="position:relative;">
          <input class="ui-input" type="password" placeholder="输入锁定密码" style="height:44px;font-size:var(--font-size-h3);padding-right:44px;text-align:center;letter-spacing:2px;" data-dom-id="input-unlock-password" autocomplete="current-password">
          <button class="icon-btn" type="button" style="position:absolute;right:6px;top:6px;" aria-label="显示密码" data-dom-id="btn-toggle-password">
            <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1.7 9S4.5 4 9 4s7.3 5 7.3 5S13.5 14 9 14 1.7 9 1.7 9z"/><circle cx="9" cy="9" r="2.2"/></svg>
          </button>
        </div>

        <div class="pin-dots" aria-hidden="true">
          <span class="pin-dot filled"></span>
          <span class="pin-dot filled"></span>
          <span class="pin-dot filled"></span>
          <span class="pin-dot filled"></span>
          <span class="pin-dot"></span>
          <span class="pin-dot"></span>
        </div>

        <button class="btn btn-primary btn-lg" type="submit" style="width:100%;" data-dom-id="btn-unlock">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" style="width:16px;height:16px;"><rect x="3.5" y="7" width="9" height="6.5" rx="1.5"/><path d="M5.5 7V5.2a2.5 2.5 0 015 0V7" stroke-linecap="round"/></svg>
          解锁
        </button>
      </form>

      <div class="keypad" style="margin-top:18px;">
        <button class="key-btn" type="button">1</button>
        <button class="key-btn" type="button">2</button>
        <button class="key-btn" type="button">3</button>
        <button class="key-btn" type="button">4</button>
        <button class="key-btn" type="button">5</button>
        <button class="key-btn" type="button">6</button>
        <button class="key-btn" type="button">7</button>
        <button class="key-btn" type="button">8</button>
        <button class="key-btn" type="button">9</button>
        <button class="key-btn ghost" type="button" aria-label="生物识别" data-dom-id="btn-biometric">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" style="width:22px;height:22px;"><path d="M12 3.5c-2 0-3.8.9-5 2.3M18.6 6.7A7.4 7.4 0 0119.5 11c0 1-.1 2-.3 2.9M5 9.5A7.5 7.5 0 004.5 11c0 3.3 1.5 6.2 3.8 8M12 7.5a3.5 3.5 0 013.5 3.5c0 2.5-.6 4.8-1.7 6.8M8.5 11A3.5 3.5 0 0112 7.5M8.6 15.2c.4 1.9 1.1 3.5 2 4.9" stroke-linecap="round"/></svg>
        </button>
        <button class="key-btn" type="button">0</button>
        <button class="key-btn ghost" type="button" aria-label="删除" data-dom-id="btn-backspace">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="width:22px;height:22px;"><path d="M9 5h10a2 2 0 012 2v10a2 2 0 01-2 2H9L3 12l6-7z" stroke-linejoin="round"/><path d="M12 9.5l5 5M17 9.5l-5 5" stroke-linecap="round"/></svg>
        </button>
      </div>

      <div class="flex items-center justify-center gap-4" style="margin-top:18px;">
        <span class="link-soft" data-dom-id="link-forgot">忘记密码？</span>
        <span style="width:1px;height:12px;background:var(--color-border-light);"></span>
        <span class="link-soft" data-dom-id="link-switch-account">切换账户</span>
      </div>

      <div style="margin-top:16px;padding:10px 12px;border-radius:var(--radius-sm);background:var(--color-bg-4);display:flex;gap:8px;text-align:left;">
        <svg viewBox="0 0 16 16" fill="none" stroke="var(--color-text-3)" stroke-width="1.5" style="width:14px;height:14px;flex-shrink:0;margin-top:2px;"><circle cx="8" cy="8" r="6"/><path d="M8 7.4v3.4M8 5.3v.1" stroke-linecap="round"/></svg>
        <span style="font-size:var(--font-size-body);color:var(--color-text-3);line-height:18px;">密码仅用于本机解锁，忘记后无法找回，只能通过加密备份在新设备恢复。</span>
      </div>
    </div>
  </div>
</div>
